[project]
name = "talentid"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "BeatriceBai", email = "beatrice.datascience@gmail.com" }
]
requires-python = ">=3.11,<3.12"
dependencies = [
    "openpyxl>=3.1.5",
    "pandas>=2.3.3",
    "pyarrow>=25.0.1",
]

[project.scripts]
talentid = "talentid:main"

[project.optional-dependencies]
embeddings = [
    "sentence-transformers>=5,<7",
]

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.6",
]
